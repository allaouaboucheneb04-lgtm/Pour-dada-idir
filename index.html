<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1020" />
  <title>TaqVox Sidi Aïch Voice V5</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <div>
      <h1>TaqVox Sidi Aïch Voice V5</h1>
      <p>Kabyle Sidi Aïch + dictionnaire prononciation</p>
    </div>
    <button id="btnVoice" class="pill">🔊 Test voix</button>
  </header>

  <main>
    <section class="speakbox">
      <textarea id="textOut" placeholder="Écris comme WhatsApp : vghigh, adccagh, adhadh, aghrom…"></textarea>
      <div class="actions">
        <button id="speakBtn" class="primary">🔊 Parler</button>
        <button id="clearBtn">Effacer</button>
        <button id="favBtn">⭐ Favori</button>
      </div>
      <div id="status" class="status">Mode iPhone : conversion automatique vers écriture arabe phonétique pour mieux prononcer gh/3/7/9. La vraie voix IA cloud pourra être branchée plus tard.</div>
    </section>

    <section class="quick emergency">
      <button data-say="Ghar i tbib" class="danger">🚨 Urgence médecin</button>
      <button data-say="Ur zmiregh ara ad nefsegh" class="danger">🚨 Je respire mal</button>
      <button data-say="I9ar7iyi atas" class="danger">🚨 J’ai très mal</button>
    </section>

    <nav id="categories" class="categories"></nav>
    <section id="phrases" class="phrases"></section>

    <section class="keyboardBox">
      <h2>Clavier kabyle</h2>
      <div id="suggestions" class="suggestions"></div>
      <div id="keyboard" class="keyboard"></div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>

<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1020" />
  <title>TaqVox Kabyle IA</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <div>
      <h1>TaqVox Kabyle IA</h1>
      <p>Communication par les yeux + voix kabyle</p>
    </div>
    <button id="btnVoice" class="pill">🔊 Test voix</button>
  </header>

  <main>
    <section class="speakbox">
      <textarea id="textOut" placeholder="La phrase choisie ou écrite apparaîtra ici…"></textarea>
      <div class="actions">
        <button id="speakBtn" class="primary">🔊 Parler</button>
        <button id="clearBtn">Effacer</button>
        <button id="favBtn">⭐ Favori</button>
      </div>
      <div id="status" class="status">Mode iPhone : aucune configuration à remplir. La vraie voix IA sera activée dès que le serveur cloud sera en ligne.</div>
    </section>

    <section class="quick emergency">
      <button data-say="Aɛiɣ! Ssiwlem i ṭbib!" class="danger">🚨 Urgence médecin</button>
      <button data-say="Ur zmirɣ ara ad neffseɣ." class="danger">🚨 Je respire mal</button>
      <button data-say="Tettqessi-yi aṭas." class="danger">🚨 J’ai très mal</button>
    </section>

    <nav id="categories" class="categories"></nav>
    <section id="phrases" class="phrases"></section>

    <section class="keyboardBox">
      <h2>Clavier kabyle</h2>
      <div id="suggestions" class="suggestions"></div>
      <div id="keyboard" class="keyboard"></div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
